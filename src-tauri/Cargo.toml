[package]
name = "pasture-panda"
version = "0.1.0"
description = "Image converter for macOS"
authors = ["you"]
edition = "2021"

[lib]
name = "pasture_panda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.10"
tauri-plugin-dialog = "2.6.0"
rayon = "1"

